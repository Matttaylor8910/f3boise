<div class="hc-popover">
  <div class="title">{{ names.length }} HC'd</div>
  <ion-list lines="none">
    <ion-item button detail="false" *ngFor="let name of names" (click)="goToPax(name)">
      <app-pax-avatar slot="start" [name]="name" [size]="32"></app-pax-avatar>
      <ion-label>{{ utilService.normalizeName(name) }}</ion-label>
    </ion-item>
  </ion-list>
</div>
