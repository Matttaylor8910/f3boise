<div class="region-map" [style.height.px]="height">
  <div class="region-map-loading" *ngIf="loading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div class="region-map-error" *ngIf="!loading && error">
    <ion-icon name="alert-circle-outline"></ion-icon>
    <span>{{ error }}</span>
  </div>

  <div class="region-map-empty" *ngIf="!loading && !error && !aos.length">
    No mapped locations
  </div>

  <google-map
    #mapRef
    *ngIf="!error"
    width="100%"
    height="100%"
    [center]="mapCenter"
    [options]="mapOptions"
    (mapInitialized)="scheduleFitBounds()">
    <ng-container *ngFor="let ao of aos">
      <map-marker
        [position]="ao.position"
        [options]="ao.markerOptions">
      </map-marker>
    </ng-container>
  </google-map>
</div>
