<!-- Overlay for mobile -->
<div class="sidebar-overlay" *ngIf="isOpen && isMobile && !shouldHide" (click)="close()"></div>

<!-- Sidebar -->
<div class="sidebar" [class.open]="isOpen" [class.desktop-open]="!isMobile" [class.hidden]="shouldHide">
  <!-- Close button for mobile -->
  <div class="sidebar-header">
    <ion-button fill="clear" class="close-button" (click)="close()" *ngIf="isMobile">
      <ion-icon slot="icon-only" name="close"></ion-icon>
    </ion-button>
  </div>

  <!-- Scrollable content wrapper -->
  <div class="sidebar-scrollable">
    <div class="sidebar-content">

      <!-- Search PAX and AOs -->
      <div class="sidebar-section pax-search-section">
        <button
          type="button"
          class="nav-link find-pax-button"
          [class.active]="paxSearchOpen"
          (click)="togglePaxSearch()">
          <ion-icon name="search"></ion-icon>
          Find a PAX or AO
        </button>
        <div class="pax-search-panel" *ngIf="paxSearchOpen">
          <input
            #paxSearchInput
            type="text"
            class="pax-search-input"
            placeholder="Search by name..."
            [(ngModel)]="paxSearchQuery"
            (input)="filterPaxResults()" />
          <div class="pax-search-loading" *ngIf="paxSearchLoading">
            <ion-spinner name="crescent"></ion-spinner>
          </div>
          <div class="pax-search-results" *ngIf="!paxSearchLoading">
            <button
              type="button"
              class="ao-link search-result"
              *ngFor="let entry of paxSearchResults"
              (click)="selectPax(entry)">
              <span>{{ entry.normalizedName }}</span>
              <span class="result-kind">{{ entry.kind }}</span>
            </button>
            <div
              class="pax-search-empty"
              *ngIf="paxSearchQuery.trim() && paxSearchResults.length === 0">
              No PAX or AO found
            </div>
          </div>
        </div>
      </div>

      <!-- The daily stuff -->
      <div class="sidebar-section">
        <ng-container *ngFor="let item of mainItems">
          <button
            type="button"
            class="nav-link with-icon"
            [class.active]="item.isActive"
            (click)="navigate(item.route)">
            <ion-icon [name]="item.icon"></ion-icon>
            {{ item.label }}
          </button>
          <!-- Current challenges nest under Challenges -->
          <ng-container *ngIf="item.route === '/challenges'">
            <button
              type="button"
              class="ao-link nested"
              *ngFor="let challenge of currentChallenges"
              [class.active]="isChallengeActive(challenge)"
              (click)="navigate('/challenges/' + challenge.id)">
              {{ challenge.name }}
            </button>
          </ng-container>
        </ng-container>
      </div>

      <!-- The signed-in PAX's own AOs -->
      <div class="sidebar-section" *ngIf="pax">
        <div class="group-title">My AOs</div>
        <button
          type="button"
          class="ao-link"
          *ngFor="let ao of myAos"
          [class.active]="isMyAoActive(ao)"
          (click)="navigate('/ao/' + ao.name)">
          {{ ao.normalizedName }}
        </button>
        <div class="ao-link muted" *ngIf="myAos.length === 0">
          Post at a few AOs and they'll show up here
        </div>
        <button
          type="button"
          class="ao-link muted"
          (click)="navigate('/aos')">
          All AOs and regions
        </button>
      </div>

      <!-- Explore and About, collapsible -->
      <div class="sidebar-section" *ngFor="let group of groups">
        <div class="region-header">
          <button
            type="button"
            class="group-title as-button"
            (click)="toggleGroup(group, $event)">
            {{ group.title }}
          </button>
          <ion-button
            fill="clear"
            class="collapse-toggle"
            (click)="toggleGroup(group, $event)">
            <ion-icon
              [name]="group.collapsed ? 'chevron-down' : 'chevron-up'"
              slot="icon-only">
            </ion-icon>
          </ion-button>
        </div>
        <div class="ao-list" [class.collapsed]="group.collapsed">
          <button
            type="button"
            class="nav-link with-icon secondary"
            *ngFor="let item of group.items"
            [class.active]="item.isActive"
            (click)="navigate(item.route)">
            <ion-icon [name]="item.icon"></ion-icon>
            {{ item.label }}
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Fixed Footer with Auth Button/User Info -->
  <div class="sidebar-footer">
    <app-auth-button></app-auth-button>
  </div>
</div>
