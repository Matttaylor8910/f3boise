# Started from the file the Firebase CLI generates, then hand-maintained.
# https://github.com/firebase/firebase-tools
#
# Builds the site and posts a preview channel link on the PR. When the PR
# touches functions/, it also lints and compiles them so a broken function
# never reaches main.

name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i @ionic/cli && npm i --force && npm run build:prod
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_F3_BOISE }}'
          # 15.34.1 (2026-10-21) asks the Service Usage API whether Hosting is
          # enabled before deploying, which the deploy service account may not
          # read, so the deploy died with "Permission denied to get service
          # [firebasehosting.googleapis.com]". Pinned to the last version that
          # deploys with the account's current roles.
          firebaseToolsVersion: 15.34.0
          projectId: f3-boise

  check_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did functions/ change?
        id: changed
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}"...HEAD -- functions firebase.json; then
            echo "functions=false" >> "$GITHUB_OUTPUT"
          else
            echo "functions=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.functions == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Lint and build functions
        if: steps.changed.outputs.functions == 'true'
        run: |
          npm ci --prefix functions
          npm run lint --prefix functions
          npm run build --prefix functions
