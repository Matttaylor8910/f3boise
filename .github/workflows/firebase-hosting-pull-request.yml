name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: npm i @ionic/cli && npm i --force && npm run build:prod
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_F3_BOISE }}'
          # 15.34.1 (2026-10-21) asks the Service Usage API whether Hosting is
          # enabled before deploying, which the deploy service account may not
          # read, so the deploy died with "Permission denied to get service
          # [firebasehosting.googleapis.com]". Pinned to the last version that
          # deploys with the account's current roles.
          firebaseToolsVersion: 15.34.0
          projectId: f3-boise
