# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: npm i @ionic/cli && npm i --force && npm run build:prod
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_F3_BOISE }}'
          # 15.34.1 (2026-10-21) asks the Service Usage API whether Hosting is
          # enabled before deploying, which the deploy service account may not
          # read, so the deploy died with "Permission denied to get service
          # [firebasehosting.googleapis.com]". Pinned to the last version that
          # deploys with the account's current roles.
          firebaseToolsVersion: 15.34.0
          channelId: live
          projectId: f3-boise
      # The Hosting action only ships the site. Firestore rules go out here,
      # after it, so a rules failure never holds back a site deploy. The
      # service account needs the "Firebase Rules Admin" role for this step.
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_F3_BOISE }}'
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@15.34.0 deploy --only firestore:rules --project f3-boise --non-interactive
